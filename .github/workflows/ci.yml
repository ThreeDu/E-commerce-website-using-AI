name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Frontend build + server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # node:test, không cần MongoDB (chỉ kiểm tra logic giá / trạng thái đơn)
      - run: npm run test:server

      # GitHub Actions đặt CI=true nên warning ESLint cũng làm build thất bại
      - run: npm run build

  ml:
    name: ML service import check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - run: pip install -r ml-service/requirements.txt

      - run: python -m compileall -q ml-service

      # Import app.py: kiểm tra phụ thuộc và nạp model đã lưu trong saved_models/ (không kết nối MongoDB)
      - name: Import Flask app
        working-directory: ml-service
        run: python -c "import app"
